name: CI Suite Poulvia

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend API Hardening & Audit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: db_lefermier_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: zend.assertions=1
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate JWT Keys for CI
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run Doctrine migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction
        env:
          APP_ENV: prod
          APP_SECRET: ci_test_secret_32_characters_long_val
          JWT_PASSPHRASE: test_passphrase
          DATABASE_URL: "mysql://root:@127.0.0.1:3306/db_lefermier_test?serverVersion=8.4.0&charset=utf8mb4"

      - name: Lint Symfony container
        run: php bin/console lint:container
        env:
          APP_ENV: prod
          APP_SECRET: ci_test_secret_32_characters_long_val
          JWT_PASSPHRASE: test_passphrase
          DATABASE_URL: "mysql://root:@127.0.0.1:3306/db_lefermier_test?serverVersion=8.4.0&charset=utf8mb4"

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync
        env:
          APP_ENV: prod
          APP_SECRET: ci_test_secret_32_characters_long_val
          JWT_PASSPHRASE: test_passphrase
          DATABASE_URL: "mysql://root:@127.0.0.1:3306/db_lefermier_test?serverVersion=8.4.0&charset=utf8mb4"

      - name: Run Backend Audit Verification Suite (28 tests P0/P1/P2)
        run: php bin/console app:audit:verify
        env:
          APP_ENV: prod
          APP_SECRET: ci_test_secret_32_characters_long_val
          JWT_PASSPHRASE: test_passphrase
          DATABASE_URL: "mysql://root:@127.0.0.1:3306/db_lefermier_test?serverVersion=8.4.0&charset=utf8mb4"

      - name: Run MySQL Integration Tests (InnoDB locks, fencing, rollback, quotas)
        run: php bin/console app:audit:integration
        env:
          APP_ENV: prod
          APP_SECRET: ci_test_secret_32_characters_long_val
          JWT_PASSPHRASE: test_passphrase
          DATABASE_URL: "mysql://root:@127.0.0.1:3306/db_lefermier_test?serverVersion=8.4.0&charset=utf8mb4"

  mobile-checks:
    name: Mobile Flutter Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Flutter Unit Tests
        run: flutter test

  web-checks:
    name: Web Next.js Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  admin-checks:
    name: Admin Next.js Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

