name: 🚀 Deploy to Production — poulvia.com

on:
  push:
    branches: [ main ]

# Un seul déploiement à la fois
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # 1. API Symfony → api.poulvia.com
  # ─────────────────────────────────────────────
  deploy-api:
    name: 🐘 Deploy API Symfony
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_SSH_HOST }}
          username: ${{ secrets.O2SWITCH_SSH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_PRIVATE_KEY }}
          port: ${{ secrets.O2SWITCH_SSH_PORT }}
          script: |
            set -e
            echo "📦 Déploiement API Symfony..."

            cd ~/Poulvia
            git fetch origin main
            git reset --hard origin/main

            cd api

            # Dépendances PHP (sans dev, optimisé)
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress

            # Migrations base de données
            php bin/console doctrine:migrations:migrate --no-interaction --env=prod

            # Nettoyage et préchauffage du cache
            php bin/console cache:clear --env=prod --no-debug
            php bin/console cache:warmup --env=prod --no-debug

            echo "✅ API déployée avec succès !"

  # ─────────────────────────────────────────────
  # 2. Landing Next.js → poulvia.com (statique)
  # ─────────────────────────────────────────────
  deploy-landing:
    name: 🌍 Deploy Landing (statique)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install & Build Landing
        working-directory: landing
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.poulvia.com

      - name: Deploy Landing via rsync SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git'
          path: landing/out/
          remote_path: ~/public_html/
          remote_host: ${{ secrets.O2SWITCH_SSH_HOST }}
          remote_port: ${{ secrets.O2SWITCH_SSH_PORT }}
          remote_user: ${{ secrets.O2SWITCH_SSH_USER }}
          remote_key: ${{ secrets.O2SWITCH_SSH_PRIVATE_KEY }}

  # ─────────────────────────────────────────────
  # 3. Web App Next.js → app.poulvia.com
  # ─────────────────────────────────────────────
  deploy-web:
    name: 🖥️ Deploy Web App (éleveurs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Web via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_SSH_HOST }}
          username: ${{ secrets.O2SWITCH_SSH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_PRIVATE_KEY }}
          port: ${{ secrets.O2SWITCH_SSH_PORT }}
          script: |
            set -e
            echo "📦 Déploiement Web App éleveurs..."

            cd ~/Poulvia
            git fetch origin main
            git reset --hard origin/main

            cd web

            # Installation des dépendances
            npm ci --omit=dev

            # Build Next.js
            NEXT_PUBLIC_API_URL=https://api.poulvia.com npm run build

            # Redémarrage Passenger (O2Switch)
            mkdir -p tmp
            touch tmp/restart.txt

            echo "✅ Web App déployée avec succès !"

  # ─────────────────────────────────────────────
  # 4. Admin Next.js → admin.poulvia.com
  # ─────────────────────────────────────────────
  deploy-admin:
    name: 🛡️ Deploy Admin Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Admin via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_SSH_HOST }}
          username: ${{ secrets.O2SWITCH_SSH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_PRIVATE_KEY }}
          port: ${{ secrets.O2SWITCH_SSH_PORT }}
          script: |
            set -e
            echo "📦 Déploiement Admin Console..."

            cd ~/Poulvia
            git fetch origin main
            git reset --hard origin/main

            cd admin

            # Installation des dépendances
            npm ci --omit=dev

            # Build Next.js
            NEXT_PUBLIC_API_URL=https://api.poulvia.com npm run build

            # Redémarrage Passenger (O2Switch)
            mkdir -p tmp
            touch tmp/restart.txt

            echo "✅ Admin Console déployée avec succès !"

  # ─────────────────────────────────────────────
  # 5. Notification finale
  # ─────────────────────────────────────────────
  notify:
    name: 📣 Notification déploiement
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-landing, deploy-web, deploy-admin]
    if: always()
  
    steps:
      - name: Résumé du déploiement
        run: |
          echo "## 🚀 Déploiement Production — $(date '+%d/%m/%Y %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Composant | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐘 API Symfony | ${{ needs.deploy-api.result == 'success' && '✅ OK' || '❌ ÉCHEC' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 Landing | ${{ needs.deploy-landing.result == 'success' && '✅ OK' || '❌ ÉCHEC' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ Web App | ${{ needs.deploy-web.result == 'success' && '✅ OK' || '❌ ÉCHEC' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Admin | ${{ needs.deploy-admin.result == 'success' && '✅ OK' || '❌ ÉCHEC' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [poulvia.com](https://poulvia.com) | [app.poulvia.com](https://app.poulvia.com) | [admin.poulvia.com](https://admin.poulvia.com)" >> $GITHUB_STEP_SUMMARY
