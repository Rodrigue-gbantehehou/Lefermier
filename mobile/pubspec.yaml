name: lefermier
description: "Application mobile native Lefermier - Gestion d'exploitations avicoles"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactive UI
  flutter_riverpod: ^2.5.1

  # HTTP Client & API Networking
  dio: ^5.7.0

  # Local Persistence & Offline Caching
  shared_preferences: ^2.3.2

  # Formatting & Localizations
  intl: ^0.19.0

  # Unique Identifiers (ULID/UUID offline creation)
  uuid: ^4.5.1

  # UI & Visuals
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
